# Wesley's Rio config - Catppuccin Mocha
# Rio IS the multiplexer. No tmux/zellij needed.
# Docs: https://rioterm.com/docs/config

[developer]
log-level = "DEBUG"
enable-log-file = true

theme = "catppuccin-mocha"

[shell]
program = "wsl.exe"
args = ["-d", "NixOS", "--", "fish", "-l"]

[window]
width = 1200
height = 800
opacity = 0.92
blur = true
decorations = "Transparent"
padding = [10, 10, 10, 10]

[navigation]
mode = "Tab"
hide-if-single = true
use-split = true
unfocused-split-opacity = 0.7

[scroll]
multiplier = 3.0
divider = 1.0

[cursor]
shape = "block"
blinking = false
blinking-interval = 800

[bell]
visual = true
audio = false

[editor]
program = "code"
args = []

[fonts]
size = 12.0

[fonts.regular]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[fonts.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[fonts.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[fonts.bold-italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

hide-mouse-cursor-when-typing = true
copy-on-select = false

[hints]
alphabet = "jfkdls;ahgurieowpq"

[[hints.rules]]
regex = "(https?://)[^\\s<>\"{}|\\\\^`]+"
hyperlinks = true
post-processing = true
persist = false

[hints.rules.action]
action = "Copy"

[hints.rules.binding]
key = "O"
mods = ["Control", "Shift"]

[title]
content = "{{ PROGRAM }} - {{ RELATIVE_PATH }}"

confirm-before-quit = false
enable-scroll-bar = true
scrollback-history-limit = 10000
