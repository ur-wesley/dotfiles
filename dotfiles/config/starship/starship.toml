# Wesley's starship config — Catppuccin Powerline (Mocha), pill-style chips.
# Adapted from the official starship Catppuccin Powerline preset.
# Shared between home-manager (Nix) and stow (Windows).
#
# Layout:
#   - Left: directory (cwd) → username → host → character
#   - Right: git_branch → git_status → languages → time
#
# Each chip is a filled pill with a powerline arrow on its right edge,
# in the next chip's color — that's what creates the "rounded pill"
# look that flows smoothly between modules.
#
# Apply changes from WSL:
#   ~/nix-config/dotfiles/update.sh
#
# Requires a Nerd Font (JetBrainsMono Nerd Font) for the powerline glyphs.

"$schema" = "https://starship.rs/config-schema.json"
command_timeout = 1000
scan_timeout = 5000
continuation_prompt = "[▸▸](bold blue)"

# Catppuccin Mocha palette — referenced by name throughout.
palette = 'catppuccin_mocha'

# LEFT: directory (cwd) → username → host → character
# RIGHT: git_branch → git_status → languages → time
#
# Each line ends with `\` (multi-line literal). Between modules,
# `[](fg:prev_bg bg:next_bg)` is a powerline transition arrow —
# starship draws a "▸" in `next_bg` to bridge from the previous
# chip's color to the next.
format = """
$directory\
[](fg:green bg:maroon)\
$username\
[](fg:maroon bg:peach)\
$hostname\
[](fg:peach bg:mauve)\
$character\
[](fg:mauve)"""

right_format = """
[](fg:maroon bg:yellow)\
$git_branch\
[](fg:yellow bg:red)\
$git_status\
[](fg:red bg:sapphire)\
$nodejs\
$rust\
$python\
$golang\
$java\
$kotlin\
$ruby\
$php\
[](fg:sapphire bg:lavender)\
$time\
[](fg:lavender)"""

# --- Prompt arrow (left side, mauve chip) -------------------------
[character]
disabled = false
success_symbol = '[❯](bold fg:crust bg:mauve)'
error_symbol = '[❯](bold fg:crust bg:red)'
vimcmd_symbol = '[❮](bold fg:crust bg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:crust bg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:crust bg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:crust bg:yellow)'

# --- Directory chip (green, first on left) -------------------------
[directory]
style = "bg:green fg:crust"
format = '[ $path ]($style)'
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 🔒"

# --- Username chip (maroon) ---------------------------------------
[username]
show_always = true
style_user = "bg:maroon fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user ]($style)'

# --- Hostname chip (peach) ----------------------------------------
[hostname]
ssh_only = false
style = "bg:peach fg:crust"
format = '[@$hostname]($style)'

# --- Git branch chip (yellow) -------------------------------------
[git_branch]
symbol = ""
style = "bg:yellow fg:crust"
format = '[ $symbol$branch ]($style)'

# --- Git status chip (red, only when dirty) -----------------------
[git_status]
style = "bg:red fg:crust"
format = '[$all_status$ahead_behind ]($style)'
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
untracked = "?"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕±${count}"

# --- Language stack — sapphire chips, each on its own pill -------

[nodejs]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[ $symbol$version ]($style)'

[rust]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[ $symbol$version ]($style)'

[python]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[ $symbol$version ]($style)'

[golang]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[ $symbol$version ]($style)'

[java]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[ $symbol$version ]($style)'

[kotlin]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[ $symbol$version ]($style)'

[ruby]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[ $symbol$version ]($style)'

[php]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[ $symbol$version ]($style)'

# --- Time chip (rightmost, lavender) ------------------------------
[time]
disabled = false
time_format = "%R"
style = "bg:lavender fg:crust"
format = '[ $time ]($style)'

# --- Disabled (minimal prompt) -----------------------------------
[memory_usage]
disabled = true

