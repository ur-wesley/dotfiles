# Wesley's starship config — minimal, omerxx-style.
# Layout: directory + character on left, everything else on right via $all.
# No background colors — just Catppuccin Mocha accent colors as text fg.
#
# Apply changes from WSL: ~/nix-config/dotfiles/update.sh

"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
command_timeout = 1000
scan_timeout = 5000
continuation_prompt = "[▸▸](bold blue)"

palette = "catppuccin_mocha"

# Minimal left: directory + plain prompt character.
# Right: $all — every other module with starship defaults.
format = """$directory$character"""
right_format = """$all"""

# --- Prompt character ---------------------------------------------
# Plain colored text arrow — no chip.
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'
vimcmd_symbol = "[N]>>>"
vimcmd_replace_symbol = "[R]>>>"
vimcmd_replace_one_symbol = "[r]>>>"
vimcmd_visual_symbol = "[V]>>>"

# --- Directory ------------------------------------------------------
# Blue fg only (no bg). Just the path with a leading space.
[directory]
style = "fg:blue bold"
format = " $path "
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 🔒"

# --- Git branch + status (yellow fg only, starship default format) ---
[git_branch]
symbol = ""
format = "[$symbol$branch]($style) "

# --- Disabled modules (no clutter on right) ----------------------
[memory_usage]
disabled = true

# ============================================================================
# Palette — Catppuccin Mocha.
# ============================================================================
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
