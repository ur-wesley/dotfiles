# Wesley's starship config — Catppuccin Mocha, rounded pills.
# Shared between home-manager (Nix) and stow (Windows).
# Literal $ characters are intentional — starship uses them for module
# references. Don't escape them.

"$schema" = "https://starship.rs/config-schema.json"
command_timeout = 1000
scan_timeout = 5000
continuation_prompt = "[▸▸](bold blue)"

# Top-level: just the prompt arrow + identity + cwd on the left.
# Git + language stack + time all live on the right edge.
# The `(`/`)` and `·` characters inside each module's `format`
# give the prompt its rounded, pill-like look.
format = """$character$username$hostname$directory"""

# Right edge: git status → language stack → time chip.
# Each module is a separate "chip" with its own Catppuccin Mocha color.
right_format = """$git_branch$git_status$nodejs$rust$python$java$kotlin$ruby$php$golang $time """

# --- Prompt arrow ----------------------------------------------
# NOTE: starship 1.25 removed the bare `symbol` and `style` keys
# from [character]. The arrow is now `success_symbol` /
# `error_symbol` / `vimcmd_*_symbol`, and color is applied via
# starship's own `[...](style)` syntax in `format`.
[character]
success_symbol = "❯"
error_symbol = "❯"
vimcmd_symbol = "❮"
vimcmd_visual_symbol = "❮"
vimcmd_replace_symbol = "❮"
vimcmd_replace_one_symbol = "❮"
format = "[$symbol](bold #cba6f7) "
disabled = false

# --- Identity --------------------------------------------------
# Note: starship's style system only kicks in on `[text](style)`,
# so the parentheses are baked into the content (as literal chars)
# and the brackets carry the style group.
[username]
style_user = "bold #f5c2e7"
style_root = "bold #f38ba8"
format = "[($user)]($style) "
show_always = true
disabled = false

[hostname]
ssh_only = false
style = "bold #94e2d5"
format = "·[@($hostname)]($style) "
disabled = false

# --- Location --------------------------------------------------
[directory]
style = "bold #89b4fa"
format = "·[($path)]($style) "
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 🔒"

# --- Git --------------------------------------------------------
[git_branch]
symbol = " "
style = "bold #fab387"
format = "·[git:($symbol$branch(:$remote_branch))]($style) "

[git_status]
style = "bold #f38ba8"
format = "[($all_status$ahead_behind)]($style) "
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
untracked = "?"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕±${count}"

# --- Languages --------------------------------------------------
[nodejs]
symbol = "⬢"
style = "bold #a6e3a1"
format = "·[($symbol $version)]($style) "

[rust]
symbol = "🦀"
style = "bold #fab387"
format = "·[($symbol $version)]($style) "

[golang]
symbol = "go"
style = "bold #94e2d5"
format = "·[($symbol $version)]($style) "

[python]
symbol = "py"
style = "bold #f9e2af"
format = "·[($symbol $version)]($style) "

[java]
symbol = "☕"
style = "bold #f38ba8"
format = "·[($symbol $version)]($style) "

[kotlin]
symbol = "🟪"
style = "bold #b4befe"
format = "·[($symbol $version)]($style) "

[ruby]
symbol = "💎"
style = "bold #f38ba8"
format = "·[($symbol $version)]($style) "

[php]
symbol = "🐘"
style = "bold #b4befe"
format = "·[($symbol $version)]($style) "

# --- Time (right edge) -----------------------------------------
[time]
style = "bold #f38ba8"
format = "[$time]($style)"
time_format = "%R"
disabled = false

# --- Disabled (kept off to stay minimal) -----------------------
[memory_usage]
disabled = true