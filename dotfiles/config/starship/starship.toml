# Wesley's starship config — omerxx-style.
# Layout: minimal left prompt (just $directory + $character), everything
# else on the right via $all. Catppuccin Mocha palette referenced by
# name throughout.
#
# Inspired by https://github.com/omerxx/dotfiles
# Apply changes from WSL: ~/nix-config/dotfiles/update.sh
# Requires a Nerd Font for the powerline glyphs.

"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
command_timeout = 1000
scan_timeout = 5000
continuation_prompt = "[▸▸](bold blue)"

palette = "catppuccin_mocha"

# Minimal left prompt — directory chip + plain character arrow.
# omerxx's signature structure: keep the left side empty, push
# everything else to the right via $all.
format = """$directory$character"""

# Right side: every module renders as its own pill with powerline
# transitions. $all is starship's catch-all variable that includes
# every other module automatically.
right_format = """$all"""

# --- Prompt character ---------------------------------------------
# Plain green text arrow — no chip, just the prompt symbol.
# Same as omerxx's style: simple, no chrome.
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'
vimcmd_symbol = "[N]>>>"
vimcmd_replace_symbol = "[R]>>>"
vimcmd_replace_one_symbol = "[r]>>>"
vimcmd_visual_symbol = "[V]>>>"

# --- Directory pill (left side, first) -----------------------------
# Blue bg, dark text — Catppuccin Mocha blue accent.
[directory]
style = "bg:blue fg:base bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 🔒"

# --- Git branch pill (yellow) -------------------------------------
[git_branch]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[$symbol$branch(:$remote_branch)]($style)"

# --- Git status pill (red) ----------------------------------------
[git_status]
style = "bg:red fg:base bold"
format = "[$all_status$ahead_behind]($style)"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
untracked = "?"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕±${count}"

# --- Language stack — sapphire accent, each on its own pill -------

[nodejs]
symbol = "⬢ "
style = "bg:sapphire fg:base bold"
format = "[$symbol$version]($style)"

[rust]
symbol = "🦀 "
style = "bg:peach fg:base bold"
format = "[$symbol$version]($style)"

[python]
symbol = " "
style = "bg:yellow fg:base bold"
format = "[$symbol$version]($style)"

[golang]
symbol = " "
style = "bg:teal fg:base bold"
format = "[$symbol$version]($style)"

[java]
symbol = "☕ "
style = "bg:red fg:base bold"
format = "[$symbol$version]($style)"

[kotlin]
symbol = "🟪 "
style = "bg:lavender fg:base bold"
format = "[$symbol$version]($style)"

[ruby]
symbol = "💎 "
style = "bg:red fg:base bold"
format = "[$symbol$version]($style)"

[php]
symbol = "🐘 "
style = "bg:lavender fg:base bold"
format = "[$symbol$version]($style)"

# --- Time pill (rightmost) ---------------------------------------
[time]
disabled = false
time_format = "%R"
style = "bg:lavender fg:base bold"
format = "[ $time ]($style)"

# --- Disabled (minimal prompt) ----------------------------------
[memory_usage]
disabled = true

# ============================================================================
# Palette — Catppuccin Mocha.
# Used as `bg:NAME` / `fg:NAME` in module style strings above.
# ============================================================================
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
