# Wesley's starship config — Catppuccin Powerline (Mocha flavor).
# Adapted from the official starship Catppuccin Powerline preset.
# Shared between home-manager (Nix) and stow (Windows).
#
# Apply changes from WSL:
#   ~/nix-config/dotfiles/update.sh
#
# Requires a Nerd Font (JetBrainsMono Nerd Font) for the powerline glyphs.

"$schema" = "https://starship.rs/config-schema.json"
command_timeout = 1000
scan_timeout = 5000
continuation_prompt = "[▸▸](bold blue)"

# Use the bundled Catppuccin Mocha palette — colors are referenced by
# name (e.g. `bg:peach`) throughout this file.
palette = 'catppuccin_mocha'

# Powerline format: each chip ends with a `(bg:prev_fg:next)` separator
# so adjacent chips connect with a smooth color transition. The `[`
# chars are the powerline "right-pointing" transitions drawn by your
# Nerd Font; the `(...)` parts are the colored backgrounds.
#
# Left:   character → username → host → directory
# Right:  git → languages → time
format = """
[](fg:lavender)\
$character\
[](fg:lavender bg:maroon)\
$username\
[](fg:maroon bg:peach)\
$hostname\
[](fg:peach bg:green)\
$directory\
[](fg:green bg:yellow)\
$git_branch\
$git_status\
[](fg:yellow bg:sapphire)\
$nodejs\
$rust\
$python\
$java\
$golang\
$kotlin\
$ruby\
$php\
[](fg:sapphire bg:lavender)\
$time"""

# --- Prompt arrow (chip) ------------------------------------------
# Plain colored arrow, not a chip — sits left of the username.
[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'

# --- Username chip ----------------------------------------------
[username]
show_always = true
style_user = "bg:maroon fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user ]($style)'

# --- Hostname chip ----------------------------------------------
[hostname]
ssh_only = false
style = "bg:peach fg:crust"
format = '[@$hostname]($style)'

# --- Directory chip --------------------------------------------
[directory]
style = "bg:green fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 🔒"

# --- Git branch + status (yellow chip) -------------------------
[git_branch]
symbol = ""
style = "bg:yellow fg:crust"
format = '[[ $symbol$branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow fg:crust"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
untracked = "?"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕±${count}"

# --- Language stack (green chip, all together) ------------------
# Each language gets its own Nerd Font icon + version in one green block.

[nodejs]
symbol = ""
style = "bg:green fg:crust"
format = '[[ $symbol$version ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green fg:crust"
format = '[[ $symbol$version ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green fg:crust"
format = '[[ $symbol$version ](fg:crust bg:green)]($style)'

[java]
symbol = ""
style = "bg:green fg:crust"
format = '[[ $symbol$version ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green fg:crust"
format = '[[ $symbol$version ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green fg:crust"
format = '[[ $symbol$version ](fg:crust bg:green)]($style)'

[ruby]
symbol = ""
style = "bg:green fg:crust"
format = '[[ $symbol$version ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green fg:crust"
format = '[[ $symbol$version ](fg:crust bg:green)]($style)'

# --- Time chip (rightmost, sapphire → lavender separator) --------
[time]
disabled = false
time_format = "%R"
style = "bg:lavender fg:crust"
format = '[ $time ]($style)'

# --- Disabled (minimal prompt) ---------------------------------
[memory_usage]
disabled = true

# ============================================================================
