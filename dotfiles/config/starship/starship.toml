# Wesley's starship config — Catppuccin Powerline (Mocha), pill-style chips.
# Adapted from the official starship Catppuccin Powerline preset.
# Shared between home-manager (Nix) and stow (Windows).
#
# Each chip is its own filled pill with explicit padding (▸...▸), so
# the visual is: rounded pill → powerline arrow → next pill.
# Time and git live on the RIGHT side of the terminal.
#
# Apply changes from WSL:
#   ~/nix-config/dotfiles/update.sh
#
# Requires a Nerd Font (JetBrainsMono Nerd Font) for the powerline glyphs.

"$schema" = "https://starship.rs/config-schema.json"
command_timeout = 1000
scan_timeout = 5000
continuation_prompt = "[▸▸](bold blue)"

# Use the bundled Catppuccin Mocha palette — colors are referenced by
# name (e.g. `bg:peach`) throughout this file.
palette = 'catppuccin_mocha'

# Left: just the prompt arrow (no chips — keeps the prompt slim).
# Right: cwd → git → languages → time (every "thing" on its own pill).
#
# Each module renders as `[ text ]($style)` which the Nerd Font draws
# as a solid filled pill. Between modules, `[](fg:prev bg:next)` adds
# the powerline arrow that bridges to the next pill color.
format = "[❯](bold fg:green) "
right_format = """\
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$python\
$golang\
$java\
$kotlin\
$ruby\
$php\
$time\
[](fg:lavender)"""

# --- Prompt arrow (left only, no chip) -----------------------------
[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

# --- Directory pill -----------------------------------------------
[directory]
style = "bg:green fg:crust"
format = '[[ $path ](fg:crust bg:green)](bg:peach)'
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 🔒"

# --- Git branch pill -----------------------------------------------
[git_branch]
symbol = ""
style = "bg:peach fg:crust"
format = '[[ $symbol$branch ](fg:crust bg:peach)](bg:yellow)'

# --- Git status pill ----------------------------------------------
# Red pill — only shows up when there are actual changes.
[git_status]
style = "bg:red fg:crust"
format = '[[($all_status$ahead_behind )](fg:crust bg:red)](bg:peach)'
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
untracked = "?"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕±${count}"

# --- Language stack — each on its own pill, sapphire color ---------

[nodejs]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[[ $symbol$version ](fg:crust bg:sapphire)](bg:yellow)'

[rust]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[[ $symbol$version ](fg:crust bg:sapphire)](bg:yellow)'

[python]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[[ $symbol$version ](fg:crust bg:sapphire)](bg:yellow)'

[golang]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[[ $symbol$version ](fg:crust bg:sapphire)](bg:yellow)'

[java]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[[ $symbol$version ](fg:crust bg:sapphire)](bg:yellow)'

[kotlin]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[[ $symbol$version ](fg:crust bg:sapphire)](bg:yellow)'

[ruby]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[[ $symbol$version ](fg:crust bg:sapphire)](bg:yellow)'

[php]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[[ $symbol$version ](fg:crust bg:sapphire)](bg:yellow)'

# --- Time pill (rightmost) -----------------------------------------
[time]
disabled = false
time_format = "%R"
style = "bg:lavender fg:crust"
format = '[ $time ]($style)'

# --- Username pill (kept on left for now; move to right by adding to right_format) ---
[username]
show_always = true
style_user = "bg:maroon fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user ]($style)'

# --- Hostname pill (kept on left for now) ---
[hostname]
ssh_only = false
style = "bg:peach fg:crust"
format = '[@$hostname]($style)'

# --- Disabled (minimal prompt) -----------------------------------
[memory_usage]
disabled = true

