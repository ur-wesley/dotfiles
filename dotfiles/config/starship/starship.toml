# Wesley's starship config — Catppuccin Mocha with full background chips.
# Shared between home-manager (Nix) and stow (Windows).
# Literal $ characters are intentional — starship uses them for module
# references. Don't escape them.
#
# Chip design:
#   - Each module renders as `[ text ](bg:accent fg:text)` — a filled block
#     with bracket characters rendered as solid powerline separators when
#     a Nerd Font is active, creating the rounded "chip" appearance.
#   - Catppuccin Mocha accents for backgrounds, dark text for contrast.

"$schema" = "https://starship.rs/config-schema.json"
command_timeout = 1000
scan_timeout = 5000
continuation_prompt = "[▸▸](bold blue)"

# Left: identity chips (character → username → host → cwd).
# Right: status chips (git → languages → time).
format = """$character$username$hostname$directory """
right_format = """$git_branch$git_status$nodejs$rust$python$java$kotlin$ruby$php$golang $time """

# --- Prompt arrow chip ------------------------------------------
# Lavender chip with dark text — the visible prompt character.
[character]
success_symbol = "❯"
error_symbol = "❯"
vimcmd_symbol = "❮"
vimcmd_visual_symbol = "❮"
vimcmd_replace_symbol = "❮"
vimcmd_replace_one_symbol = "❮"
style = "bg:#cba6f7 fg:#1e1e2e bold"
format = "[ $symbol ]($style) "
disabled = false

# --- Username chip ---------------------------------------------
# Surface1 background, pink foreground. Root user gets a red chip.
[username]
style_user = "bg:#45475a fg:#f5c2e7 bold"
style_root = "bg:#f38ba8 fg:#1e1e2e bold"
format = "[ $user ]($style) "
show_always = true
disabled = false

# --- Hostname chip ---------------------------------------------
# Surface1 background, teal foreground.
[hostname]
ssh_only = false
style = "bg:#45475a fg:#94e2d5 bold"
format = "[@ $hostname ]($style) "
disabled = false

# --- Directory chip --------------------------------------------
# Blue background, dark foreground. Path fills the chip.
[directory]
style = "bg:#89b4fa fg:#1e1e2e bold"
format = "[ $path ]($style) "
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 🔒"

# --- Git branch chip -------------------------------------------
# Peach background, dark foreground.
[git_branch]
symbol = " "
style = "bg:#fab387 fg:#1e1e2e bold"
format = "[$symbol$branch]($style) "

# --- Git status chip -------------------------------------------
# Red background when there are changes, dark foreground.
[git_status]
style = "bg:#f38ba8 fg:#1e1e2e bold"
format = "[$all_status$ahead_behind]($style) "
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
untracked = "?"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕±${count}"

# --- Language stack chips --------------------------------------
# Each language gets its own Catppuccin Mocha accent.

[nodejs]
symbol = "⬢ "
style = "bg:#a6e3a1 fg:#1e1e2e bold"
format = "[$symbol$version]($style) "

[rust]
symbol = "🦀 "
style = "bg:#fab387 fg:#1e1e2e bold"
format = "[$symbol$version]($style) "

[golang]
symbol = "go "
style = "bg:#94e2d5 fg:#1e1e2e bold"
format = "[$symbol$version]($style) "

[python]
symbol = "py "
style = "bg:#f9e2af fg:#1e1e2e bold"
format = "[$symbol$version]($style) "

[java]
symbol = "☕ "
style = "bg:#f38ba8 fg:#1e1e2e bold"
format = "[$symbol$version]($style) "

[kotlin]
symbol = "🟪 "
style = "bg:#b4befe fg:#1e1e2e bold"
format = "[$symbol$version]($style) "

[ruby]
symbol = "💎 "
style = "bg:#f38ba8 fg:#1e1e2e bold"
format = "[$symbol$version]($style) "

[php]
symbol = "🐘 "
style = "bg:#b4befe fg:#1e1e2e bold"
format = "[$symbol$version]($style) "

# --- Time chip (rightmost, always visible) --------------------
# Red chip — pops against the Catppuccin Mocha palette.
[time]
style = "bg:#f38ba8 fg:#1e1e2e bold"
format = "[ $time ]($style)"
time_format = "%R"
disabled = false

# --- Disabled (kept off to stay minimal) -----------------------
[memory_usage]
disabled = true