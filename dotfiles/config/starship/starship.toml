# Wesley's starship config — omerxx-style layout + Catppuccin Powerline
# rendering. Each "badge" is a rounded pill: [[ text ](fg:prev_bg bg:self_bg)]
# The powerline `▸` glyph bridges between pills with a smooth color
# transition, giving the rounded-segment look from the Pastel Powerline
# preset. Nerd Font required (JetBrainsMono Nerd Font).
#
# Inspired by:
#   https://github.com/omerxx/dotfiles
#   https://starship.rs/presets/pastel-powerline
#
# Apply changes from WSL: ~/nix-config/dotfiles/update.sh

"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
command_timeout = 1000
scan_timeout = 5000
continuation_prompt = "[▸▸](bold blue)"

palette = "catppuccin_mocha"

# Minimal left: directory pill + plain green prompt character.
# Right: $all renders every other module as a rounded powerline pill.
format = """$directory$character"""
right_format = """$all"""

# --- Prompt character ---------------------------------------------
# Plain green text arrow — no chip, just the prompt symbol.
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'
vimcmd_symbol = "[N]>>>"
vimcmd_replace_symbol = "[R]>>>"
vimcmd_replace_one_symbol = "[r]>>>"
vimcmd_visual_symbol = "[V]>>>"

# --- Directory pill (left, first) ---------------------------------
# The Pastel Powerline trick: wrap the chip in [[ text ](fg:prev bg:self)]
# so the right edge becomes a powerline arrow in the next color,
# making the pill look "rounded" at the seam.
[directory]
style = "bg:blue fg:base bold"
format = '[[ $path ](fg:base bg:blue)](bg:yellow)'
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 🔒"

# --- Git branch pill ----------------------------------------------
[git_branch]
symbol = ""
style = "bg:yellow fg:base bold"
format = '[[ $symbol$branch(:$remote_branch) ](fg:base bg:yellow)](bg:red)'

# --- Git status pill (red, only when dirty) -----------------------
[git_status]
style = "bg:red fg:base bold"
format = '[[ $all_status$ahead_behind ](fg:base bg:red)](bg:sapphire)'
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
untracked = "?"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕±${count}"

# --- Language stack — sapphire pills, powerline-wrapped ----------
[nodejs]
symbol = "⬢ "
style = "bg:sapphire fg:base bold"
format = '[[ $symbol$version ](fg:base bg:sapphire)](bg:peach)'

[rust]
symbol = "🦀 "
style = "bg:peach fg:base bold"
format = '[[ $symbol$version ](fg:base bg:peach)](bg:yellow)'

[python]
symbol = " "
style = "bg:yellow fg:base bold"
format = '[[ $symbol$version ](fg:base bg:yellow)](bg:teal)'

[golang]
symbol = " "
style = "bg:teal fg:base bold"
format = '[[ $symbol$version ](fg:base bg:teal)](bg:green)'

[java]
symbol = "☕ "
style = "bg:red fg:base bold"
format = '[[ $symbol$version ](fg:base bg:red)](bg:lavender)'

[kotlin]
symbol = "🟪 "
style = "bg:lavender fg:base bold"
format = '[[ $symbol$version ](fg:base bg:lavender)](bg:mauve)'

[ruby]
symbol = "💎 "
style = "bg:red fg:base bold"
format = '[[ $symbol$version ](fg:base bg:red)](bg:maroon)'

[php]
symbol = "🐘 "
style = "bg:lavender fg:base bold"
format = '[[ $symbol$version ](fg:base bg:lavender)](bg:sapphire)'

# --- Time pill (rightmost) ---------------------------------------
[time]
disabled = false
time_format = "%R"
style = "bg:lavender fg:base bold"
format = "[ $time ]($style)"

# --- Disabled (minimal prompt) ----------------------------------
[memory_usage]
disabled = true

# ============================================================================
# Palette — Catppuccin Mocha. Referenced as bg:NAME / fg:NAME above.
# ============================================================================
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
