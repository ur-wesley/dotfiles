# Wesley's starship config — omerxx-style minimal.
# Layout: minimal left prompt ($directory + $character), everything else
# on the right via $all. Catppuccin Mocha palette + per-module chip
# styling for that "rounded pill" look.
#
# Inspired by https://github.com/omerxx/dotfiles
# Apply changes from WSL: ~/nix-config/dotfiles/update.sh
# Requires a Nerd Font for the powerline glyphs.

"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
command_timeout = 1000
scan_timeout = 5000
continuation_prompt = "[▸▸](bold blue)"

palette = "catppuccin_mocha"

# Minimal left prompt — just the cwd and the prompt character.
# This is omerxx's signature: keep the left side empty, push
# everything else to the right via $all.
format = """$directory$character"""

# Right side: every module renders as its own pill with powerline
# transitions. Modules not styled below (or disabled) are skipped.
right_format = """$all"""

# --- Prompt character ---------------------------------------------
[character]
success_symbol = '[➜](bold #a6e3a1)'
error_symbol = '[➜](bold #f38ba8)'
vimcmd_symbol = "[N]>>>"
vimcmd_replace_symbol = "[R]>>>"
vimcmd_replace_one_symbol = "[r]>>>"
vimcmd_visual_symbol = "[V]>>>"

# --- Directory pill (left side, first) -----------------------------
[directory]
style = "bg:#89b4fa fg:#1e1e2e bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 🔒"

# --- Username pill (optional, off by default) ---------------------
[username]
show_always = true
style_user = "bg:#45475a fg:#f5c2e7 bold"
style_root = "bg:#f38ba8 fg:#1e1e2e bold"
format = "[ $user ]($style)"

# --- Hostname pill (off by default) -------------------------------
[hostname]
ssh_only = false
style = "bg:#45475a fg:#94e2d5 bold"
format = "[@$hostname]($style)"

# --- Git branch pill (yellow) -------------------------------------
[git_branch]
symbol = ""
style = "bg:#f9e2af fg:#1e1e2e bold"
format = "[$symbol$branch]($style)"

# --- Git status pill (red) ----------------------------------------
[git_status]
style = "bg:#f38ba8 fg:#1e1e2e bold"
format = "[$all_status$ahead_behind]($style)"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
untracked = "?"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕±${count}"

# --- Language pills (sapphire, on their own) ----------------------
[nodejs]
symbol = "⬢ "
style = "bg:#74c7ec fg:#1e1e2e bold"
format = "[$symbol$version]($style)"

[rust]
symbol = "🦀 "
style = "bg:#fab387 fg:#1e1e2e bold"
format = "[$symbol$version]($style)"

[python]
symbol = " "
style = "bg:#f9e2af fg:#1e1e2e bold"
format = "[$symbol$version]($style)"

[golang]
symbol = " "
style = "bg:#94e2d5 fg:#1e1e2e bold"
format = "[$symbol$version]($style)"

[java]
symbol = "☕ "
style = "bg:#f38ba8 fg:#1e1e2e bold"
format = "[$symbol$version]($style)"

[kotlin]
symbol = "🟪 "
style = "bg:#b4befe fg:#1e1e2e bold"
format = "[$symbol$version]($style)"

[ruby]
symbol = "💎 "
style = "bg:#f38ba8 fg:#1e1e2e bold"
format = "[$symbol$version]($style)"

[php]
symbol = "🐘 "
style = "bg:#b4befe fg:#1e1e2e bold"
format = "[$symbol$version]($style)"

# --- Time pill (lavender, rightmost) ------------------------------
[time]
disabled = false
time_format = "%R"
style = "bg:#b4befe fg:#1e1e2e bold"
format = "[ $time ]($style)"

# --- Disabled (minimal prompt) ----------------------------------
[memory_usage]
disabled = true

# ============================================================================
# Palette — Catppuccin Mocha (referenced by name throughout)
# ============================================================================
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
