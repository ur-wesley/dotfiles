# Wesley's starship config — omerxx-style layout + explicit powerline
# rounded pills. Each badge uses literal ▸ chars between modules for the
# rounded connecting arrow, so the effect is visible even on fonts
# without powerline glyphs. Catppuccin Mocha palette throughout.
#
# Apply changes from WSL: ~/nix-config/dotfiles/update.sh
# Nerd Font recommended (JetBrainsMono Nerd Font) for best appearance.

"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
command_timeout = 1000
scan_timeout = 5000
continuation_prompt = "[▸▸](bold blue)"

palette = "catppuccin_mocha"

# Minimal left: directory pill + plain green prompt character.
# Right: every other module as a rounded powerline pill, chained with
# explicit `▸` separators colored by the previous pill's bg.
format = """$directory$character"""
right_format = """
$git_branch▸$git_status▸$nodejs▸$rust▸$python▸$golang▸$time
"""

# --- Prompt character ---------------------------------------------
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'
vimcmd_symbol = "[N]>>>"
vimcmd_replace_symbol = "[R]>>>"
vimcmd_replace_one_symbol = "[r]>>>"
vimcmd_visual_symbol = "[V]>>>"

# --- Directory pill (left, first) ---------------------------------
[directory]
style = "bg:blue fg:base bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 🔒"

# --- Git branch pill (yellow) -------------------------------------
[git_branch]
symbol = ""
style = "bg:yellow fg:base bold"
format = "[$symbol$branch]($style)"

# --- Git status pill (red, only when dirty) -----------------------
[git_status]
style = "bg:red fg:base bold"
format = "[$all_status$ahead_behind]($style)"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
untracked = "?"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕±${count}"

# --- Language stack — sapphire pills -----------------------------
# Use `[[ ▸ ... ]](fg:prev_bg bg:self_bg)` so the leading `[[ ▸` is a
# rounded left edge in the previous pill's color, and the `]](bg:next)`
# is a rounded right edge in the next pill's color. Together they
# create the "rounded powerline pill" look from the Pastel Powerline
# preset, with the `▸` glyph visible as the connector.
[nodejs]
symbol = "⬢ "
style = "bg:sapphire fg:base bold"
format = "[[ ▸ $symbol$version ](fg:yellow bg:sapphire)](bg:peach)"

[rust]
symbol = "🦀 "
style = "bg:peach fg:base bold"
format = "[[ ▸ $symbol$version ](fg:sapphire bg:peach)](bg:yellow)"

[python]
symbol = " "
style = "bg:yellow fg:base bold"
format = "[[ ▸ $symbol$version ](fg:peach bg:yellow)](bg:teal)"

[golang]
symbol = " "
style = "bg:teal fg:base bold"
format = "[[ ▸ $symbol$version ](fg:yellow bg:teal)](bg:green)"

[java]
symbol = "☕ "
style = "bg:red fg:base bold"
format = "[[ ▸ $symbol$version ](fg:sapphire bg:red)](bg:lavender)"

[kotlin]
symbol = "🟪 "
style = "bg:lavender fg:base bold"
format = "[[ ▸ $symbol$version ](fg:red bg:lavender)](bg:mauve)"

[ruby]
symbol = "💎 "
style = "bg:red fg:base bold"
format = "[[ ▸ $symbol$version ](fg:lavender bg:red)](bg:maroon)"

[php]
symbol = "🐘 "
style = "bg:lavender fg:base bold"
format = "[[ ▸ $symbol$version ](fg:red bg:lavender)](bg:sapphire)"

# --- Time pill (rightmost, lavender) ------------------------------
[time]
disabled = false
time_format = "%R"
style = "bg:lavender fg:base bold"
format = "[ $time ]($style)"

# --- Disabled (minimal prompt) ----------------------------------
[memory_usage]
disabled = true

# ============================================================================
# Palette — Catppuccin Mocha. Referenced as bg:NAME / fg:NAME above.
# ============================================================================
[palettes.catppuccin_mocha]
