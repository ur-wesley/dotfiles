# Wesley's zellij config — single-pane default, Catppuccin Mocha theme.
# Shared between home-manager (Nix) and stow (Windows).
# Docs: https://zellij.dev/documentation/

# Use the bundled single-pane layout for day-to-day work.
# Splits happen on demand via Ctrl+P then n/s/v.
default_layout "dev"

# Catppuccin Mocha theme — same palette as rio/starship/Windows Terminal.
theme "catppuccin-mocha"

# Mouse + simplified UI matches rio-style minimalism.
mouse_mode true
simplified_ui true

# Pane frames on, but with the theme's muted color so they stay subtle.
pane_frames true

# Bind scrollback editor to neovim.
scrollback_editor "/run/current-system/sw/bin/nvim"

# 10k lines of scrollback per pane.
scrollback_lines_to_serialize 10000

# Don't copy on select — matches fish/rio preference; copy is explicit.
copy_on_select false

# Copy through clip.exe on WSL (falls back to nothing on Linux).
copy_command "clip.exe"
copy_clipboard "clip.exe"

# Default shell when launching zellij — fish inside WSL.
default_shell "fish"

# Mirror terminal — works correctly with WezTerm/Rio/Windows Terminal.
mirror_session true

# Auto-attach to existing session on start.
auto_layout false
on_force_close "quit"