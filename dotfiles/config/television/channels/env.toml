# channels/env.toml — search environment variables.
# Bound via `tv env`.

[metadata]
name = "env"
description = "Fuzzy find environment variables"

[source]
command = "env | sort"

[preview]
command = "echo {1} | sed 's/^/export /' | bat --language=sh --color=always --style=plain"

[keybindings]
select = ["enter"]