# Wesley's navi snippets
# Fuzzy-searched from fish via `navi` (bound to <C-g>).
#
# Add more here as needed. navi also auto-imports:
#   - `tldr` pages for any command with a tldr entry
#   - shell history (run `navi --best-matches` against history)
#   - your fish aliases (via `navi --query "alias"`)
#
# Format: https://github.com/denisidoro/navi/blob/master/docs/snippet_templates.md

- name: nix-config / rebuild switch (normal)
  cmd: sudo nixos-rebuild switch --flake ~/nix-config#nixos-wsl
- name: nix-config / rebuild switch (full refresh)
  cmd: sudo nixos-rebuild switch --flake ~/nix-config#nixos-wsl --refresh
- name: nix-config / rebuild test (apply on next boot only)
  cmd: sudo nixos-rebuild test --flake ~/nix-config#nixos-wsl
- name: nix-config / rebuild boot (add to bootloader)
  cmd: sudo nixos-rebuild boot --flake ~/nix-config#nixos-wsl
- name: nix-config / rollback previous generation
  cmd: sudo nixos-rebuild --rollback switch
- name: nix-config / flake update + rebuild both
  cmd: nix flake update ~/nix-config && sudo nixos-rebuild switch --flake ~/nix-config#nixos-wsl && home-manager switch --flake ~/nix-config#wesley@nixos-wsl
- name: nix-config / home-manager switch only
  cmd: home-manager switch --flake ~/nix-config#wesley@nixos-wsl
- name: nix-config / garbage collect old store paths
  cmd: nix-collect-garbage -d
- name: nix-config / search for a package by name
  cmd: nix search nixpkgs '<query>'
- name: nix-config / fix sudo setuid (after rebuild, as root)
  cmd: sudo -i; chmod 4755 /nix/store/*-sudo-rs*/bin/sudo

- name: dotfiles / commit grouped by change (conventional)
  cmd: git add -A && git -c user.email=wesley@ur-wesley.dev -c user.name=wesley commit -m "<type>(<scope>): <subject>"
- name: dotfiles / sync from repo
  cmd: cd ~/nix-config && git pull && sudo nixos-rebuild switch --flake .#nixos-wsl

- name: fish / zoxide jump
  cmd: z <pattern>
- name: fish / zoxide interactive picker
  cmd: zi
- name: fish / reload fish config
  cmd: source ~/.config/fish/config.fish

- name: mise / install latest of every tool
  cmd: mise install --latest
- name: mise / show current tool versions
  cmd: mise current
- name: mise / list available versions of a tool
  cmd: mise ls-remote <tool>

- name: docker / nuke all containers + volumes
  cmd: docker stop $(docker ps -aq); docker system prune --volumes -f
- name: docker / show container resource usage (live)
  cmd: docker stats
- name: docker / shell into running container (by name pattern)
  cmd: docker exec -it $(docker ps -qf 'name=<pattern>') sh
- name: docker compose / restart a single service
  cmd: docker compose restart <service>
- name: docker compose / tail logs of a service
  cmd: docker compose logs -f <service>

- name: kubectl / get all pods across all namespaces
  cmd: kubectl get pods -A
- name: kubectl / describe a stuck pod
  cmd: kubectl describe pod <pod> -n <namespace>
- name: kubectl / exec into a pod
  cmd: kubectl exec -it <pod> -n <namespace> -- sh
- name: kubectl / tail logs of a pod
  cmd: kubectl logs -f <pod> -n <namespace>
- name: kubectl / switch namespace (kubens)
  cmd: kns <namespace>
- name: kubectl / switch context (kubectx)
  cmd: kctx <context>
- name: kubectl / show events sorted by timestamp
  cmd: kubectl get events --sort-by=.metadata.creationTimestamp

- name: git / undo last commit (keep changes staged)
  cmd: git reset --soft HEAD~1
- name: git / undo last commit (discard changes)
  cmd: git reset --hard HEAD~1
- name: git / delete merged local branches
  cmd: git branch --merged | grep -v '^\*' | xargs -n 1 git branch -d
- name: git / delete merged remote branches
  cmd: git branch -r --merged | grep -v 'main\|master' | sed 's/origin\///' | xargs -I {} git push origin :{}
- name: git / show file at a specific commit
  cmd: git show <commit>:<file>
- name: git / find commit that introduced a bug with bisect
  cmd: git bisect start; git bisect bad HEAD; git bisect good <commit>; <test>; git bisect good|bad

- name: system / disk usage by directory (top 20)
  cmd: dust -d 2 -r /
- name: system / top processes by memory
  cmd: procs --sort rss
- name: system / listening ports
  cmd: ss -tlnp