# Wesley's navi snippets
# Fuzzy-searched from fish via `navi` (bound to <C-g>).
#
# Add more here as needed. navi also auto-imports:
#   - `tldr` pages for any command with a tldr entry
#   - shell history (run `navi --best-matches` against history)
#   - your fish aliases (via `navi --query "alias"`)
#
# Format: https://github.com/denisidoro/navi/blob/master/docs/snippet_templates.md

- name: nix-config / rebuild + switch (full)
  cmd: cd ~/nix-config && sudo nixos-rebuild switch --flake '.#nixos-wsl'

- name: nix-config / dry-build only
  cmd: cd ~/nix-config && sudo nixos-rebuild build --flake '.#nixos-wsl'

- name: nix-config / update flake.lock
  cmd: cd ~/nix-config && nix flake update

- name: nix-config / fix sudo setuid (WSL workaround)
  cmd: sudo -i; chmod 4755 /nix/store/*-sudo-rs*/bin/sudo

- name: dotfiles / commit grouped by change (conventional)
  cmd: 'git add -A && git -c user.email=wesley@ur-wesley.dev -c user.name=wesley commit -m "<type>(<scope>): <subject>"'
- name: dotfiles / sync from repo
  cmd: cd ~/nix-config && git pull && sudo nixos-rebuild switch --flake '.#nixos-wsl'

- name: fish / zoxide jump
  cmd: z <pattern>
- name: fish / zoxide interactive picker
  cmd: zi

- name: mise / list installed runtimes
  cmd: mise list
- name: mise / install latest of a runtime
  cmd: mise use --global <runtime>@latest
- name: mise / current runtime versions
  cmd: mise current

- name: docker / nuke all stopped containers + dangling images
  cmd: docker system prune -af
- name: docker / shell into running container
  cmd: docker exec -it <container> /bin/bash

- name: kubectl / context list
  cmd: kubectl config get-contexts
- name: kubectl / switch context
  cmd: kubectx <context>
- name: kubectl / tail logs of a pod
  cmd: stern <pod-prefix>

- name: git / undo last commit (keep changes)
  cmd: git reset --soft HEAD~1
- name: git / undo last commit (drop changes)
  cmd: git reset --hard HEAD~1
- name: git / drop uncommitted changes
  cmd: git checkout -- .
- name: git / drop untracked files
  cmd: git clean -fd
- name: git / amend last commit
  cmd: git commit --amend --no-edit
- name: git / interactive rebase last N commits
  cmd: git rebase -i HEAD~<n>

- name: system / show disk usage by directory
  cmd: dust
- name: system / show processes sorted by cpu
  cmd: procs --sort cpu
- name: system / disk free + usage
  cmd: duf
- name: system / interactive process viewer
  cmd: btop

- name: search / file content (ripgrep)
  cmd: rg <pattern>
- name: search / filenames (fd)
  cmd: fd <pattern>
- name: search / JSON (jq pretty-print)
  cmd: jq . <file.json>
- name: search / YAML (yq pretty-print)
  cmd: yq . <file.yaml>

- name: net / public IP
  cmd: curl ifconfig.me
- name: net / listening ports
  cmd: ss -tlnp

- name: nvim / edit config file
  cmd: nvim ~/nix-config/home/wesley/nvim.nix
- name: nvim / open telescope keymap picker
  cmd: <leader>?